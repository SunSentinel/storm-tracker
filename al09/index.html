<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Sentinel: Hurricane Tracker</title>

    <link rel="stylesheet" type="text/css" href="app.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato" >
</head>
<body>
    <div id="map"> </div>

    <div id="timestamp">
        <p>Updates every hour.</p>
        <p>
            Sources: <a href="https://www.nhc.noaa.gov/" target="_blank">National Hurricane Center</a> (Official Forecast) &amp; 
            <a href="https://www.ral.ucar.edu/hurricanes/" target="_blank">NOAA/UCAR ATCF</a> (Computer Models) | 
            Map: <a href="https://www.sun-sentinel.com/author/david-schutz/" target="_blank">David Schutz / South Florida Sun Sentinel</a>
        </p>
        <p style="font-size: 11px; margin-top: 3px; color: #666; font-style: italic;">
            Note: Computer model lines represent unedited guidance and should not be used in place of official NHC forecasts.
        </p>
    </div>

    <!-- 1. Leaflet & D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    
    <!-- 2. Shapefile Parsing Dependencies -->
    <script src="catiline.js"></script>
    <script src="shp.js"></script>
    
    <!-- 3. Leaflet Plugins -->
    <script src="leaflet.shpfile.js"></script>
    
    <!-- 4. Your App Logic -->
    <script src="app.js"></script>
</body>
</html>
